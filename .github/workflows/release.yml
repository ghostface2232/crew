# Pushing a version tag (v1.2.3) checks the code, builds both desktop apps and publishes them as a GitHub release.
# The asset names are the ones the apps' updaters look for (docs/macos-app.md, docs/windows-app.md).
# Nothing is published unless every job before `publish` passes. Run by hand from the Actions tab, it rehearses
# all of that on any branch and publishes nothing.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Daemons compare these versions to decide which replaces which, so they must match the tag.
      - name: Check versions match the tag
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          [[ "$want" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tag must be a stable version (v1.2.3), got $GITHUB_REF_NAME"; exit 1; }
          for file in package.json plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json; do
            have=$(jq -r .version "$file")
            [ "$have" = "$want" ] || { echo "::error file=$file::version $have does not match tag $GITHUB_REF_NAME"; exit 1; }
          done

  # Type checks, and the unit tests on macOS and Windows, as on a pull request.
  verify:
    needs: check
    uses: ./.github/workflows/ci.yml
    # ci.yml's pull-request-only job asks for actions: read, and a called workflow cannot ask for more than this grants.
    permissions:
      contents: read
      actions: read

  macos:
    needs: [check, verify]
    # The app icon is an Xcode 27 Icon Composer document, and hosted runners have only Xcode 26,
    # whose actool cannot compile it. This runs on the maintainer's Mac with Xcode 27.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      # The official Node.js tarball is standalone and ships its LICENSE one folder above bin/node,
      # which the build copies into the app.
      # No npm cache: on this Mac it would save the whole local npm cache (2.5 GB) under the key the hosted macOS
      # check uses, and a later release would download it again instead of reading the copy already on disk.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: xcodebuild -version
      - run: npm ci
      # The app's own Swift tests, which need this Xcode. The unit tests already ran on macOS in `verify`.
      - run: npm run test:native
      # Every release is signed with the same self-signed certificate. macOS ties the folder access a person grants to
      # it, so an update keeps that access; an ad-hoc signature changes with each build and asks again.
      - name: Load the signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] || { echo "::error::MACOS_SIGNING_P12 and MACOS_SIGNING_P12_PASSWORD must be set"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          # Self-signed, so not trusted: listed among the matching identities rather than the valid ones.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::The signing certificate holds no code signing identity"; exit 1; }
          echo "CREW_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CREW_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: npm run package:desktop
      - name: Check the app is signed with the certificate
        run: codesign -d -r- release/Crew.app 2>&1 | grep -q 'certificate leaf' || { echo "::error::Crew.app is not signed with the release certificate"; exit 1; }
      # This runner is a person's Mac, so the keychain must not outlive the job.
      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            release/Crew-macOS-*.zip
            release/Crew-macOS-*.dmg
          if-no-files-found: error

  windows:
    needs: [check, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Electron build renders its icons with Playwright's Chromium.
      - run: npx playwright install chromium
      - run: npm run package:desktop
      # Starts the packaged app against its own daemon, so an installer that cannot start is never published.
      # It ran once on Windows without ending, so it is bounded, and Playwright logs each call to show where one stops.
      - name: Smoke test the packaged app
        run: node scripts/desktop.mjs smoke
        timeout-minutes: 10
        env:
          CREW_APP_PATH: release/win-unpacked/Crew.exe
          DEBUG: pw:api
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/Crew-Setup-*.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Not assets/, which the checkout already holds (the app icon among it).
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{version}/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Crew ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
