# Pushing a version tag (v1.2.3) builds both desktop apps and publishes them as a GitHub release.
# The asset names are the ones the apps' updaters look for (docs/08-native-macos.md, docs/12-windows-electron.md).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Daemons compare these versions to decide which replaces which, so they must match the tag.
      - name: Check versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          for file in package.json plugin/.claude-plugin/plugin.json; do
            have=$(jq -r .version "$file")
            [ "$have" = "$want" ] || { echo "::error file=$file::version $have does not match tag $GITHUB_REF_NAME"; exit 1; }
          done

  macos:
    needs: check
    # The app icon is an Xcode 27 Icon Composer document, and hosted runners have only Xcode 26,
    # whose actool cannot compile it. This runs on the maintainer's Mac with Xcode 27.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      # The official Node.js tarball is standalone and ships its LICENSE one folder above bin/node,
      # which the build copies into the app.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run package:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: release/Crew-macOS-*.zip
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Electron build renders its icons with Playwright's Chromium.
      - run: npx playwright install chromium
      - run: npm run package:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/Crew-Setup-*.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Not assets/, which the checkout already holds (the app icon among it).
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Crew ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes
